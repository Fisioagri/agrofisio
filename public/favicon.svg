<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0A3D2E"/>

  <!-- Stem -->
  <line x1="16" y1="29" x2="16" y2="20" stroke="#4ADE80" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Petioles -->
  <line x1="16" y1="21" x2="13" y2="19.5" stroke="#4ADE80" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="19" y2="19.5" stroke="#4ADE80" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="16" y1="20.5" x2="16" y2="18.5" stroke="#4ADE80" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Left leaf -->
  <ellipse cx="9" cy="16.5" rx="4" ry="5.5" fill="#22C55E" transform="rotate(-50 9 16.5)"/>

  <!-- Right leaf -->
  <ellipse cx="23" cy="16.5" rx="4" ry="5.5" fill="#22C55E" transform="rotate(50 23 16.5)"/>

  <!-- Terminal leaf -->
  <ellipse cx="16" cy="12" rx="4.5" ry="6.5" fill="#4ADE80"/>
</svg>
